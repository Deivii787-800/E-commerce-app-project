{% extends 'base.html' %}

{% block content %}    

<h1>Mis pedidos</h1>

    {% for order in orders %}

    <div>
        <h2>
            Pedido #{{ order.id }}
        </h2>

        <p>
            fecha: {{ order.created_at }}
        </p>

        <p>
            Estado: {{ order.get_status_display }}
        </p>

        <p>
            Total: ${{ order.total }}
        </p>

        <a href="{% url 'virtualApp:order_detail' order.id %}">
            Ver pedido
        </a>

    </div>

    {% empty %}

        <p>Aun no tienes pedidos.</p>

    {% endfor %}

{% endblock %}
